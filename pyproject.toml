[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datajud-scraper"
version = "0.1.0"
description = "Descargador responsable de expedientes publicos de PROJUDI/TJBA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "lxml>=5,<7",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "respx>=0.22,<1",
    "ruff>=0.9",
]

[project.scripts]
datajud-scraper = "datajud_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
